[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-automation-kit"
version = "0.1.0"
description = "Scheduled SQL cohort reports to Excel and PDF, with run history and change diffs, on synthetic Synthea-style data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Knok-exe" }]
dependencies = ["openpyxl>=3.1", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
report-kit = "report_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/report_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "DTZ"]
